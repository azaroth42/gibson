<!DOCTYPE html>
<html>

<head>
    <title>Dungeon World Sheet</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Merriweather&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/dw/dw_sheet.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/4.0.2/marked.min.js"></script>
    <style>
        /* Inline overrides for new layout */
        #stats-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .option-group {
            margin-bottom: 20px;
            background: rgba(0, 0, 0, 0.2);
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #433;
        }

        .option-group label {
            display: block;
            font-family: 'Cinzel', serif;
            color: rgb(47, 25, 2);
            margin-bottom: 5px;
            font-size: 0.9em;
        }

        .option-select {
            width: 100%;
            padding: 5px;
            background: #222;
            color: #eee;
            border: 1px solid #544;
            font-family: 'Merriweather', serif;
        }

        .look-box {
            width: 100%;
            height: 60px;
            background: #222;
            color: #eee;
            border: 1px solid #544;
            padding: 5px;
            font-family: 'Merriweather', serif;
            resize: vertical;
        }

        .option-desc {
            font-size: 0.85em;
            color: #460606;
            margin-top: 5px;
            font-style: italic;
        }

        /* Modal CSS */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #e8dcc5;
            padding: 20px;
            border-radius: 5px;
            border: 2px solid #522;
            width: 80%;
            max-width: 600px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #522;
            padding-bottom: 10px;
        }

        .modal-header h2 {
            margin: 0;
            font-family: 'Cinzel', serif;
            color: #522;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: #522;
        }

        .scrollalbe-list {
            overflow-y: auto;
            flex-grow: 1;
        }
    </style>
</head>

<body>

    <div class="sheet-header">
        <div class="header-left">
            <h1 id="char-name">Character Name</h1>
            <h3 id="char-class">Class Level 1</h3>
        </div>
        <div class="header-right">
            <div class="hp-label">Hit Points</div>
            <div class="hp-bar-container">
                <div id="hp-bar-fill" class="hp-bar-fill"></div>
                <div class="hp-text-overlay">
                    <span style="margin-right:10px; cursor:pointer;" onclick="updateVital('current_hp', -1)">[-]</span>
                    <span id="current-hp">20</span> / <span id="max-hp">20</span>
                    <span style="margin-left:10px; cursor:pointer;" onclick="updateVital('current_hp', 1)">[+]</span>
                </div>
            </div>
        </div>
    </div>

    <div class="sheet-container">
        <div class="sidebar">
            <h3 style="text-align:center;">Stats</h3>
            <div id="stats-container">
                <!-- Stat Boxes -->
            </div>

            <!-- Alignment & Race -->
            <div style="margin-top:30px; padding:0 10px;">
                <div class="option-group">
                    <label>Alignment</label>
                    <select id="alignment-select" class="option-select"
                        onchange="updateOption('alignment', this.value)"></select>
                    <div id="alignment-desc" class="option-desc"></div>
                </div>

                <div class="option-group">
                    <label>Race</label>
                    <select id="race-select" class="option-select" onchange="updateOption('race', this.value)"></select>
                    <div id="race-desc" class="option-desc"></div>
                </div>

            </div>

            <h3 style="text-align:center; margin-top:30px;">Vitals</h3>
            <div class="vitals-grid">
                <!-- Row 1 -->
                <div class="vital-box">
                    <div style="font-size:0.8em;">Armor</div>
                    <span id="armor" class="stat-val">0</span>
                    <div style="margin-top:5px;">
                        <button class="btn" style="padding:0 5px; font-size:0.8em;"
                            onclick="updateVital('armor', -1)">-</button>
                        <button class="btn" style="padding:0 5px; font-size:0.8em;"
                            onclick="updateVital('armor', 1)">+</button>
                    </div>
                </div>

                <!-- Row 2 -->
                <div class="vital-box">
                    <div style="font-size:0.8em;">XP</div>
                    <span id="xp" class="stat-val">0</span>
                    <div style="margin-top:5px;">
                        <button class="btn" style="padding:0 5px; font-size:0.8em;"
                            onclick="updateVital('xp', -1)">-</button>
                        <button class="btn" style="padding:0 5px; font-size:0.8em;"
                            onclick="updateVital('xp', 1)">+</button>
                    </div>
                </div>
                <div class="vital-box">
                    <div style="font-size:0.8em; color:#a80;">Coin</div>
                    <span id="coin" class="stat-val">0</span>
                </div>
                <div class="vital-box">
                    <div style="font-size:0.8em; color:#800;">Damage Die</div>
                    <span id="damage-die" class="stat-val" style="font-family:'Cinzel', serif;">-</span>
                </div>
            </div>

            <div class="option-group" style="margin-top:20px;">
                <label>Look</label>
                <textarea id="look-input" class="look-box" onblur="updateLook(this.value)"
                    placeholder="Describe your look..."></textarea>
            </div>
        </div>

        <div class="main-content">
            <!-- Look Removed (Moved to Sidebar) -->

            <h2>Moves</h2>
            <div id="moves-container">
                <!-- Moves -->
            </div>

            <h2>
                Gear
                <button class="btn" style="font-size:0.6em; margin-left:10px;" onclick="openItemModal()">+ Add</button>
                <span style="font-size:0.6em; float:right;">Load: <span id="load">0</span>/10</span>
            </h2>
            <div id="gear-container">
                <!-- Items -->
            </div>
        </div>
    </div>

    <!-- Add Move Modal -->
    <div id="add-move-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Add Advanced Move</h2>
                <button class="close-btn" onclick="closeAddMoveModal()">&times;</button>
            </div>
            <div id="available-moves-list" class="scrollalbe-list">
                <!-- Moves will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Item Modal -->
    <div id="item-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="item-modal-title">Add Equipment</h2>
                <button class="close-btn" onclick="closeItemModal()">&times;</button>
            </div>
            <div class="modal-body" style="display:flex; flex-direction:column; gap:10px;">
                <input type="hidden" id="item-id">
                <div>
                    <label style="display:block; font-family:'Cinzel',serif; color:#522;">Name</label>
                    <input type="text" id="item-name" class="option-select">
                </div>
                <div>
                    <label style="display:block; font-family:'Cinzel',serif; color:#522;">Tags (comma separated)</label>
                    <input type="text" id="item-tags" class="option-select">
                </div>
                <div>
                    <label style="display:block; font-family:'Cinzel',serif; color:#522;">Description</label>
                    <textarea id="item-desc" class="look-box" style="height:100px;"></textarea>
                </div>
                <div style="display:flex; justify-content:flex-end; margin-top:10px;">
                    <button class="btn" onclick="saveItem()">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const charId = urlParams.get('id');
        let charData = null;
        let availableOptions = [];

        const STATS = ['str', 'dex', 'con', 'int', 'wis', 'cha'];
        const NAMES = {
            'str': 'Strength', 'dex': 'Dexterity', 'con': 'Constitution',
            'int': 'Intelligence', 'wis': 'Wisdom', 'cha': 'Charisma'
        };

        async function init() {
            await fetchChar();
            await fetchOptions();
            render();
        }

        async function fetchChar() {
            const res = await fetch(`/dw/characters/${charId}`);
            charData = await res.json();
        }

        async function fetchOptions() {
            if (!charData) return;
            const res = await fetch(`/dw/options?hero_class=${charData.hero_class}`);
            availableOptions = await res.json();
        }

        function render() {
            if (!charData) return;

            document.getElementById('char-name').textContent = charData.name;
            document.getElementById('char-class').textContent = `${charData.hero_class} Level ${charData.level}`;
            document.getElementById('max-hp').textContent = charData.max_hp;
            document.getElementById('coin').textContent = charData.coin;

            // Look
            const lookInput = document.getElementById('look-input');
            if (document.activeElement !== lookInput) {
                lookInput.value = charData.look || "";
            }

            // Options (Alignment/Race)
            const canEditOptions = (charData.level === 1 && charData.xp === 0);
            renderOptionSelect('alignment', 'alignment-select', 'alignment-desc', canEditOptions);
            renderOptionSelect('race', 'race-select', 'race-desc', canEditOptions);

            // Render Damage Die
            const damageOpt = availableOptions.find(o => o.type === 'damage_die');
            document.getElementById('damage-die').textContent = damageOpt ? damageOpt.description : "d6";

            // Vitals
            const curHp = charData.current_hp;
            const maxHp = charData.max_hp || 20; // fallback
            const hpPercent = Math.min((curHp / maxHp) * 100, 100);

            document.getElementById('current-hp').textContent = curHp;
            document.getElementById('max-hp').textContent = maxHp;
            document.getElementById('hp-bar-fill').style.width = `${hpPercent}%`;

            document.getElementById('armor').textContent = charData.armor;
            document.getElementById('xp').textContent = charData.xp;

            // Stats
            renderStats();

            // Moves
            renderMoves();

            // Gear
            renderGear();
        }

        function renderOptionSelect(type, selectId, descId, canEdit) {
            const select = document.getElementById(selectId);
            const desc = document.getElementById(descId);
            const currentVal = charData[type];

            // Filter options by type
            const options = availableOptions.filter(o => o.type === type);

            // Use disabled property to lock the select element
            select.disabled = !canEdit;

            // Save selection if rebuilding
            const savedVal = select.value;
            select.innerHTML = '';

            // Default option if none selected
            if (!currentVal) {
                const def = document.createElement('option');
                def.value = "";
                def.text = "Select...";
                select.appendChild(def);
            }

            options.forEach(opt => {
                const el = document.createElement('option');
                el.value = opt.name; // Store Name as value
                el.text = opt.name;
                el.dataset.desc = opt.description;
                if (opt.name === currentVal) el.selected = true;
                select.appendChild(el);
            });

            // Update description
            const selectedOpt = options.find(o => o.name === (currentVal || select.value));
            desc.textContent = selectedOpt ? selectedOpt.description : "";
        }

        function renderStats() {
            const statsDiv = document.getElementById('stats-container');
            const canEditStats = (charData.level === 1 && charData.xp === 0);

            statsDiv.innerHTML = '';

            // Validation (Standard Array)
            if (canEditStats) {
                const TARGET_STATS = [16, 15, 13, 12, 9, 8];
                const currentStats = STATS.map(k => charData[k]).sort((a, b) => b - a);
                const isValid = JSON.stringify(currentStats) === JSON.stringify(TARGET_STATS);
                const statusColor = isValid ? 'green' : '#a33';
                const gridSpan = document.createElement('div');
                gridSpan.style.gridColumn = "1 / -1";
                gridSpan.style.textAlign = "center";
                gridSpan.style.fontWeight = "bold";
                gridSpan.style.color = statusColor;
                gridSpan.textContent = isValid ? 'Valid Stats' : 'Assign: 16, 15, 13, 12, 9, 8';
                statsDiv.appendChild(gridSpan);
            }

            STATS.forEach(key => {
                const val = charData[key];
                const mod = valToMod(val);
                const sign = mod >= 0 ? '+' : '';

                let controls = '';
                if (canEditStats) {
                    controls = `
                        <div style="margin-top:5px; display:flex; justify-content:center; gap:5px;">
                            <button class="btn" style="padding:0 5px; font-size:0.8em;" onclick="updateStat('${key}', -1)">-</button>
                            <button class="btn" style="padding:0 5px; font-size:0.8em;" onclick="updateStat('${key}', 1)">+</button>
                        </div>
                    `;
                }

                const box = document.createElement('div');
                box.className = 'stat-box';
                box.innerHTML = `
                    <div style="font-size:0.9em; text-transform:uppercase;">${NAMES[key]}</div>
                    <div class="stat-val">${val}</div>
                    <div class="stat-mod">${sign}${mod}</div>
                    ${controls}
                `;
                statsDiv.appendChild(box);
            });
        }

        function valToMod(val) {
            if (val >= 18) return 3;
            if (val >= 16) return 2;
            if (val >= 13) return 1;
            if (val >= 9) return 0;
            if (val >= 6) return -1;
            if (val >= 4) return -2;
            return -3;
        }

        function renderMoves() {
            const movesDiv = document.getElementById('moves-container');
            movesDiv.innerHTML = '';

            const classMoves = charData.moves.filter(m => m.type !== 'basic' && m.type !== 'special');
            const basicMoves = charData.moves.filter(m => m.type === 'basic');
            const specialMoves = charData.moves.filter(m => m.type === 'special');

            // Sort: Starting < Advanced, then Alphabetical
            classMoves.sort((a, b) => {
                const typeOrder = { 'starting': 0, 'advanced': 1 };
                const scoreA = typeOrder[a.type] !== undefined ? typeOrder[a.type] : 2;
                const scoreB = typeOrder[b.type] !== undefined ? typeOrder[b.type] : 2;

                if (scoreA !== scoreB) return scoreA - scoreB;
                return a.name.localeCompare(b.name);
            });

            if (classMoves.length > 0) {
                const header = document.createElement('div');
                header.style.display = 'flex';
                header.style.justifyContent = 'space-between';
                header.style.alignItems = 'center';
                header.innerHTML = '<h3>Class Moves</h3>';

                // Add Move Button Logic
                const advancedMovesCount = charData.moves.filter(m => m.type === 'advanced').length;
                const allowedMoves = Math.max(0, charData.level - 1);

                if (advancedMovesCount < allowedMoves) {
                    const btn = document.createElement('button');
                    btn.className = 'btn';
                    btn.textContent = 'Add Move';
                    btn.style.fontSize = '0.8em';
                    btn.onclick = openAddMoveModal;
                    header.appendChild(btn);
                }

                movesDiv.appendChild(header);
                classMoves.forEach(m => movesDiv.appendChild(createMoveCard(m, true)));
            }

            renderMoveSection(movesDiv, 'Basic Moves', basicMoves, false);
            renderMoveSection(movesDiv, 'Special Moves', specialMoves, false);
        }

        function renderMoveSection(container, title, moves, startExpanded) {
            if (moves.length === 0) return;
            const wrapper = document.createElement('div');
            wrapper.style.marginBottom = '20px';
            const header = document.createElement('div');
            header.className = 'section-header';
            header.style.cssText = "cursor:pointer; font-family:'Cinzel',serif; color:#522; font-size:1.2em; font-weight:bold; border-bottom:1px solid #522; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center;";
            header.innerHTML = `<span>${title}</span> <span style="font-size:0.8em;">${startExpanded ? '▼' : '▶'}</span>`;
            const content = document.createElement('div');
            content.style.display = startExpanded ? 'block' : 'none';
            header.onclick = () => {
                const isHidden = content.style.display === 'none';
                content.style.display = isHidden ? 'block' : 'none';
                header.lastElementChild.textContent = isHidden ? '▼' : '▶';
            };
            moves.forEach(m => content.appendChild(createMoveCard(m, false)));
            wrapper.appendChild(header);
            wrapper.appendChild(content);
            container.appendChild(wrapper);
        }

        function createMoveCard(m, defaultDescVisible = false) {
            const card = document.createElement('div');
            card.className = 'move-card';
            const displayStyle = defaultDescVisible ? 'block' : 'none';
            card.innerHTML = `
                <div class="move-header" onclick="this.nextElementSibling.style.display = this.nextElementSibling.style.display==='none'?'block':'none'">
                    <span>${m.name}</span>
                    <span style="font-size:0.8em; color:#888;">${m.type}</span>
                </div>
                <div class="move-desc" style="display:${displayStyle};">
                    ${marked.parse(m.description || "")}
                </div>
             `;
            return card;
        }

        function renderGear() {
            const gearDiv = document.getElementById('gear-container');
            gearDiv.innerHTML = '';
            let totalLoad = 0;
            charData.items.forEach(i => {
                totalLoad += (i.weight * i.qty);
                const row = document.createElement('div');
                row.className = 'item-row';
                row.style.cursor = 'pointer';

                // Content
                const contentSpan = document.createElement('span');
                contentSpan.innerHTML = `<strong>${i.name}</strong> <span style="font-size:0.9em; color:#666;">(${i.tags ? i.tags.join(', ') : ''})</span>`;
                contentSpan.onclick = () => openItemModal(i);

                // Delete Button
                const delBtn = document.createElement('span');
                delBtn.textContent = '[x]';
                delBtn.style.color = '#a00';
                delBtn.style.marginLeft = '10px';
                delBtn.style.cursor = 'pointer';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteItem(i.id);
                };

                row.appendChild(contentSpan);
                row.appendChild(delBtn);

                // Description (if any)
                if (i.description) {
                    const descDiv = document.createElement('div');
                    descDiv.style.fontSize = '0.85em';
                    descDiv.style.fontStyle = 'italic';
                    descDiv.style.color = '#555';
                    descDiv.style.marginLeft = '10px';
                    descDiv.textContent = i.description;
                    // row is flex? No, strictly block by default style. 
                    // Let's modify structure slightly
                    const wrapper = document.createElement('div');
                    wrapper.appendChild(contentSpan);
                    wrapper.appendChild(delBtn);
                    row.innerHTML = ''; // reset
                    row.appendChild(wrapper);
                    row.appendChild(descDiv);
                }

                gearDiv.appendChild(row);
            });
            document.getElementById('load').textContent = totalLoad;
        }

        // Item Management Logic
        function openItemModal(item = null) {
            const modal = document.getElementById('item-modal');
            const title = document.getElementById('item-modal-title');
            const idInput = document.getElementById('item-id');
            const nameInput = document.getElementById('item-name');
            const tagsInput = document.getElementById('item-tags');
            const descInput = document.getElementById('item-desc');

            modal.style.display = 'flex';

            if (item) {
                title.textContent = 'Edit Equipment';
                idInput.value = item.id;
                nameInput.value = item.name;
                tagsInput.value = item.tags ? item.tags.join(', ') : '';
                descInput.value = item.description || '';
            } else {
                title.textContent = 'Add Equipment';
                idInput.value = '';
                nameInput.value = '';
                tagsInput.value = '';
                descInput.value = '';
            }
        }

        function closeItemModal() {
            document.getElementById('item-modal').style.display = 'none';
        }

        async function saveItem() {
            const id = document.getElementById('item-id').value;
            const name = document.getElementById('item-name').value;
            const tagsStr = document.getElementById('item-tags').value;
            const desc = document.getElementById('item-desc').value;

            if (!name) {
                alert("Name is required");
                return;
            }

            const tags = tagsStr.split(',').map(t => t.trim()).filter(t => t);

            const payload = {
                name: name,
                description: desc,
                tags: tags,
                qty: 1, // Default
                weight: 0 // Default, user said don't worry about it
            };

            try {
                let url = `/dw/characters/${charId}/items`;
                let method = 'POST';

                if (id) {
                    url += `/${id}`;
                    method = 'PUT';
                }

                const res = await fetch(url, {
                    method: method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (res.ok) {
                    closeItemModal();
                    charData = await res.json();
                    render();
                } else {
                    alert("Error saving item");
                }
            } catch (e) {
                console.error(e);
                alert("Error saving item");
            }
        }

        async function deleteItem(itemId) {
            if (!confirm("Delete this item?")) return;
            try {
                const res = await fetch(`/dw/characters/${charId}/items/${itemId}`, {
                    method: 'DELETE'
                });

                if (res.ok) {
                    charData = await res.json();
                    render();
                } else {
                    alert("Error deleting item");
                }
            } catch (e) {
                alert("Error deleting item");
            }
        }

        async function updateOption(key, value) {
            if (!value) return;
            await updateCharFields({ [key]: value });
        }

        async function updateLook(value) {
            if (value === charData.look) return;
            await updateCharFields({ look: value });
        }

        async function updateVital(key, delta) {
            const currentVal = charData[key];
            let newVal = currentVal + delta;
            // Clamping
            if (key === 'current_hp') {
                if (newVal < 0) newVal = 0;
                if (newVal > charData.max_hp) newVal = charData.max_hp;
            } else {
                if (newVal < 0) newVal = 0;
            }
            await updateCharFields({ [key]: newVal });
        }

        async function updateStat(stat, delta) {
            const newVal = charData[stat] + delta;
            if (newVal < 1 || newVal > 18) return;
            await updateCharFields({ [stat]: newVal });
        }

        async function updateCharFields(fields) {
            const res = await fetch(`/dw/characters/${charId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(fields)
            });
            if (res.ok) {
                charData = await res.json();
                render();
            } else {
                alert("Error updating character");
            }
        }

        // Add Move Modal Logic
        async function openAddMoveModal() {
            const modal = document.getElementById('add-move-modal');
            const list = document.getElementById('available-moves-list');
            list.innerHTML = 'Loading...';
            modal.style.display = 'flex';

            try {
                const res = await fetch(`/dw/characters/${charId}/available-moves`);
                const moves = await res.json();
                list.innerHTML = '';

                if (moves.length === 0) {
                    list.innerHTML = '<div style="padding:10px; text-align:center;">No available moves found.</div>';
                    return;
                }

                moves.forEach(m => {
                    const item = document.createElement('div');
                    item.className = 'move-card';
                    item.style.cursor = 'default';
                    item.innerHTML = `
                        <div class="move-header" style="justify-content:space-between; cursor:default;">
                            <strong>${m.name}</strong>
                            <button class="btn" style="font-size:0.8em;" onclick="addMove(${m.id})">Add</button>
                        </div>
                        <div class="move-desc" style="display:block; font-size:0.9em; padding-top:5px;">
                            ${marked.parse(m.description || "")}
                        </div>
                    `;
                    list.appendChild(item);
                });
            } catch (e) {
                list.innerHTML = '<div style="color:red; paading:10px;">Error loading moves</div>';
            }
        }

        function closeAddMoveModal() {
            document.getElementById('add-move-modal').style.display = 'none';
        }

        async function addMove(moveId) {
            try {
                const res = await fetch(`/dw/characters/${charId}/moves`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ move_id: moveId })
                });

                if (res.ok) {
                    closeAddMoveModal();
                    charData = await res.json();
                    render();
                } else {
                    const err = await res.json();
                    alert("Error: " + err.detail);
                }
            } catch (e) {
                alert("Error adding move");
            }
        }

        init();
    </script>
</body>

</html>
