<!DOCTYPE html>
<html>

<head>
    <title>DW - GM Character Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Merriweather&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/dw_sheet.css">
    <style>
        body {
            text-align: center;
            background-image: url('/static/dw_bg.jpg');
            background-size: cover;
            background-attachment: fixed;
            background-color: #2b2b2b;
            margin: 0;
            padding: 10px;
        }

        /* Top Header Bar */
        .controls-area {
            background: rgba(255, 255, 255, 0.95);
            max-width: 1200px;
            margin: 0 auto 20px auto;
            padding: 10px 20px;
            border: 2px solid #855;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: flex-start;
            border-radius: 4px;
        }

        h1 {
            color: #855;
            font-family: 'Cinzel', serif;
            font-size: 1.5em;
            margin: 0;
            padding-right: 20px;
            border-right: 1px solid #aaa;
            text-transform: uppercase;
        }

        /* Custom Dropdown Styling */
        .custom-select-container {
            position: relative;
            display: inline-block;
        }

        .dropdown-btn {
            background: #fff;
            border: 1px solid #888;
            padding: 8px 12px;
            cursor: pointer;
            min-width: 200px;
            text-align: left;
            font-family: inherit;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dropdown-btn:after {
            content: '▼';
            font-size: 0.8em;
            color: #666;
            margin-left: 10px;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #fff;
            min-width: 250px;
            max-height: 400px;
            overflow-y: auto;
            box-shadow: 0 8px 16px 0 rgba(0, 0, 0, 0.2);
            z-index: 100;
            border: 1px solid #888;
            text-align: left;
            top: 100%;
            left: 0;
        }

        .dropdown-content.show {
            display: block;
        }

        .dropdown-item {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            color: #000;
            display: block;
        }

        .dropdown-item:hover {
            background-color: #f1f1f1;
        }

        .dropdown-item label {
            cursor: pointer;
            display: flex;
            align-items: center;
            width: 100%;
            margin: 0;
            /* Override global */
            font-weight: normal;
        }

        .dropdown-item input {
            margin-right: 10px;
            width: auto;
            /* Override global */
        }

        .btn {
            background: #855;
            color: #fff;
            border: none;
            padding: 8px 16px;
            font-size: 0.9em;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
            transition: all 0.2s;
            height: fit-content;
        }

        .btn:hover {
            box-shadow: 0 0 5px #f4e4bc;
            background: #a66;
        }

        .btn-secondary {
            background: #555;
            font-size: 0.8em;
        }

        /* Grid Layout */
        .cards-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 1200px) {
            .cards-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 800px) {
            .cards-container {
                grid-template-columns: 1fr;
            }
        }

        /* Card Styling */
        .char-card {
            background: rgba(245, 245, 245, 0.95);
            border: 1px solid #444;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.7);
            padding: 15px;
            text-align: left;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .char-header {
            border-bottom: 2px solid #855;
            padding-bottom: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        .char-name {
            font-family: 'Cinzel', serif;
            font-size: 1.4em;
            color: #855;
            margin: 0;
        }

        .char-class {
            font-style: italic;
            color: #555;
            font-size: 0.9em;
        }

        .form-section {
            background: rgba(230, 230, 230, 0.5);
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
        }

        .section-title {
            margin: 0 0 10px 0;
            color: #333;
            font-weight: bold;
            font-size: 0.9em;
            text-transform: uppercase;
            border-bottom: 1px solid #aaa;
            padding-bottom: 2px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 5px;
        }

        label {
            display: block;
            color: #444;
            margin-bottom: 2px;
            font-size: 0.8em;
            font-weight: bold;
        }

        input[type="number"] {
            background: #fff;
            border: 1px solid #999;
            color: #000;
            padding: 5px;
            width: 100%;
            font-family: inherit;
            font-size: 1em;
            box-sizing: border-box;
        }

        .status-msg {
            text-align: center;
            font-weight: bold;
            height: 20px;
            margin-top: 10px;
            font-size: 0.9em;
        }

        .back-link {
            display: inline-block;
            margin-top: 40px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            color: #eee;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #555;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #e8dcc5;
            padding: 0;
            border-radius: 5px;
            border: 2px solid #522;
            width: 80%;
            max-width: 1000px;
            height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            overflow: hidden;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #522;
            color: #fff;
            border-bottom: 2px solid #300;
        }

        .modal-header h2 {
            margin: 0;
            font-family: 'Cinzel', serif;
            color: #fff;
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 1.5em;
            cursor: pointer;
            color: #fff;
        }

        .browse-container {
            display: flex;
            flex-grow: 1;
            overflow: hidden;
        }

        .class-list {
            width: 250px;
            background: rgba(0, 0, 0, 0.1);
            border-right: 1px solid #855;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .class-item {
            padding: 15px;
            border-bottom: 1px solid #ccc;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            color: #333;
            transition: background 0.2s;
        }

        .class-item:hover {
            background: rgba(136, 85, 85, 0.1);
        }

        .class-item.active {
            background: #855;
            color: #fff;
        }

        .moves-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 20px;
            background: rgba(255, 255, 255, 0.3);
        }

        .move-category {
            font-family: 'Cinzel', serif;
            font-size: 1.2em;
            color: #855;
            border-bottom: 2px solid #855;
            margin-top: 20px;
            margin-bottom: 15px;
            padding-bottom: 5px;
        }

        .move-category:first-child {
            margin-top: 0;
        }

        .move-card {
            background: #fff;
            border: 1px solid #ccc;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .move-card:hover {
            border-color: #855;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            transform: translateX(5px);
        }

        .move-card h4 {
            margin: 0 0 5px 0;
            color: #333;
            font-family: 'Cinzel', serif;
        }

        .move-card .desc {
            font-size: 0.9em;
            color: #555;
            max-height: 3.6em;
            /* roughly 3 lines */
            overflow: hidden;
            text-overflow: ellipsis;
        }
    </style>
</head>

<body>

    <div class="controls-area">
        <h1>DW Manager</h1>

        <div class="custom-select-container">
            <div class="dropdown-btn" onclick="toggleDropdown()">Select Characters</div>
            <div id="dropdown-list" class="dropdown-content">
                <!-- Checkboxes populated here -->
            </div>
        </div>

        <button class="btn" onclick="loadSelected()">Load Selected</button>

        <div style="margin-left:auto; display:flex; gap:10px;">
            <button class="btn btn-secondary" onclick="gridTemplate3()">3 Col</button>
            <button class="btn btn-secondary" onclick="gridTemplate4()">4 Col</button>
        </div>
    </div>

    <div id="cards-container" class="cards-container">
        <!-- Cards injected here -->
    </div>

    <a href="/static/dw/gm_panel.html" class="back-link">&lt; Back to GM Panel</a>

    <!-- Add Move Modal -->
    <div id="move-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="move-modal-title">Add Move</h2>
                <button class="close-btn" onclick="closeMoveModal()">&times;</button>
            </div>
            <div class="browse-container">
                <div id="class-list" class="class-list">
                    <!-- Class items injected here -->
                </div>
                <div id="moves-area" class="moves-list">
                    <div style="padding:40px; text-align:center; color:#666; font-style:italic;">
                        Select a Class to view moves...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let loadedCharacters = [];
        let allMoves = [];
        let activeCharId = null;

        async function init() {
            try {
                const res = await fetch('/dw/characters');
                const chars = await res.json();
                loadedCharacters = chars; // Cache list

                const list = document.getElementById('dropdown-list');
                list.innerHTML = '';

                // Add "Select All" option? Maybe later.

                chars.forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'dropdown-item';
                    div.innerHTML = `
                        <label>
                            <input type="checkbox" value="${c.id}" class="char-checkbox">
                            ${c.name} <span style="font-size:0.8em; color:#666; margin-left:5px;">(${c.hero_class})</span>
                        </label>
                    `;
                    list.appendChild(div);
                });

                // Pre-fetch moves
                loadAllMoves();
            } catch (e) {
                console.error("Failed to load characters list", e);
            }
        }

        async function loadAllMoves() {
            try {
                const res = await fetch('/dw/moves');
                allMoves = await res.json();
            } catch (e) {
                console.error("Failed to load moves", e);
            }
        }

        function toggleDropdown() {
            document.getElementById("dropdown-list").classList.toggle("show");
        }

        // Close dropdown if clicked outside
        window.onclick = function (event) {
            if (!event.target.matches('.dropdown-btn') && !event.target.closest('.dropdown-content')) {
                var dropdowns = document.getElementsByClassName("dropdown-content");
                for (var i = 0; i < dropdowns.length; i++) {
                    var openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }

        async function loadSelected() {
            const checkboxes = document.querySelectorAll('.char-checkbox:checked');
            const selectedIds = Array.from(checkboxes).map(cb => cb.value);
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            if (selectedIds.length === 0) {
                container.innerHTML = '<div style="grid-column:1/-1; color:#fff; font-size:1.2em;">No characters selected.</div>';
                return;
            }

            // Reuse cached list if we have full data, but simple list might lack details?
            // The /dw/characters endpoint returns full objects according to schema (response_model=List[DWCharacter]).
            // So we can just use loadedCharacters.

            const selectedChars = loadedCharacters.filter(c => selectedIds.includes(String(c.id)));

            // Re-fetch to be safe about latest state? User might have edited elsewhere.
            // Let's re-fetch all for simplicity since N is small.
            try {
                const res = await fetch('/dw/characters');
                const allChars = await res.json();
                loadedCharacters = allChars; // Update cache

                const FRESHselectedChars = allChars.filter(c => selectedIds.includes(String(c.id)));

                FRESHselectedChars.forEach(char => {
                    renderCard(char, container);
                });
            } catch (e) {
                console.error(e);
            }

            // Hide dropdown
            document.getElementById("dropdown-list").classList.remove("show");
        }

        function renderCard(char, container) {
            // Handle STR/INT aliases from API vs JSON
            const strVal = char.str !== undefined ? char.str : char.strength;
            const intVal = char.int !== undefined ? char.int : char.int_stat;

            const card = document.createElement('div');
            card.className = 'char-card';
            card.id = `card-${char.id}`;

            card.innerHTML = `
                <div class="char-header">
                    <h2 class="char-name"><a href="/static/dw/dw_sheet.html?id=${char.id}">${char.name}</a></h2>
                    <span class="char-class">${char.hero_class} | Lvl ${char.level}</span>
                </div>

                <div class="form-section">
                    <div class="section-title">Vitals</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>HP Current</label>
                            <input type="number" class="inp-hp" value="${char.current_hp}">
                        </div>
                        <div class="form-group">
                            <label>HP Max</label>
                            <input type="number" class="inp-max-hp" value="${char.max_hp}">
                        </div>
                        <div class="form-group">
                            <label>XP</label>
                            <input type="number" class="inp-xp" value="${char.xp}">
                        </div>
                        <div class="form-group">
                            <label>Level</label>
                            <input type="number" class="inp-level" value="${char.level}">
                        </div>
                        <div class="form-group">
                            <label>Coin</label>
                            <input type="number" class="inp-coin" value="${char.coin || 0}">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="section-title">Stats</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>STR</label>
                            <input type="number" class="inp-str" value="${strVal}" min="3" max="18">
                        </div>
                        <div class="form-group">
                            <label>DEX</label>
                            <input type="number" class="inp-dex" value="${char.dex}" min="3" max="18">
                        </div>
                        <div class="form-group">
                            <label>CON</label>
                            <input type="number" class="inp-con" value="${char.con}" min="3" max="18">
                        </div>
                        <div class="form-group">
                            <label>INT</label>
                            <input type="number" class="inp-int" value="${intVal}" min="3" max="18">
                        </div>
                        <div class="form-group">
                            <label>WIS</label>
                            <input type="number" class="inp-wis" value="${char.wis}" min="3" max="18">
                        </div>
                        <div class="form-group">
                            <label>CHA</label>
                            <input type="number" class="inp-cha" value="${char.cha}" min="3" max="18">
                        </div>
                    </div>
                </div>

                <div style="margin-top:auto; display:flex; flex-direction:column; gap:10px;">
                    <button class="btn" style="width:100%;" onclick="openMoveModal('${char.id}', '${char.name}')">Add Move</button>
                    <button class="btn" style="width:100%;" onclick="saveCard(${char.id})">Save Changes</button>
                </div>
                <div class="status-msg" id="status-${char.id}"></div>
            `;
            container.appendChild(card);
        }

        async function saveCard(id) {
            const card = document.getElementById(`card-${id}`);
            const status = document.getElementById(`status-${id}`);

            // Gather data
            const updates = {
                current_hp: parseInt(card.querySelector('.inp-hp').value),
                max_hp: parseInt(card.querySelector('.inp-max-hp').value),
                xp: parseInt(card.querySelector('.inp-xp').value),
                level: parseInt(card.querySelector('.inp-level').value),
                coin: parseInt(card.querySelector('.inp-coin').value),
                str: parseInt(card.querySelector('.inp-str').value),
                dex: parseInt(card.querySelector('.inp-dex').value),
                con: parseInt(card.querySelector('.inp-con').value),
                int: parseInt(card.querySelector('.inp-int').value),
                wis: parseInt(card.querySelector('.inp-wis').value),
                cha: parseInt(card.querySelector('.inp-cha').value),
            };

            status.textContent = "Saving...";
            status.style.color = "#555";

            try {
                const res = await fetch(`/dw/characters/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updates)
                });

                if (res.ok) {
                    status.textContent = "Saved!";
                    status.style.color = "green";
                    setTimeout(() => status.textContent = "", 2000);
                } else {
                    status.textContent = "Error saving";
                    status.style.color = "red";
                }
            } catch (e) {
                console.error(e);
                status.textContent = "Network Error";
                status.style.color = "red";
            }
        }

        function gridTemplate3() {
            document.getElementById('cards-container').style.gridTemplateColumns = 'repeat(3, 1fr)';
        }
        function gridTemplate4() {
            document.getElementById('cards-container').style.gridTemplateColumns = 'repeat(4, 1fr)';
        }

        /* Modal Logic */
        function openMoveModal(charId, charName) {
            activeCharId = charId;
            document.getElementById('move-modal-title').textContent = `Add Move to ${charName}`;
            document.getElementById('move-modal').style.display = 'flex';
            renderClassList();
        }

        function closeMoveModal() {
            document.getElementById('move-modal').style.display = 'none';
            activeCharId = null;
            document.getElementById('moves-area').innerHTML = '<div style="padding:40px; text-align:center; color:#666; font-style:italic;">Select a Class to view moves...</div>';
            // Clear active class selection
            document.querySelectorAll('.class-item').forEach(el => el.classList.remove('active'));
        }

        function renderClassList() {
            const container = document.getElementById('class-list');
            container.innerHTML = '';

            // Extract unique classes
            const classes = new Set();
            classes.add("Special / Basic"); // For null class moves

            allMoves.forEach(m => {
                if (m.class) classes.add(m.class);
            });

            const sortedClasses = Array.from(classes).sort();

            sortedClasses.forEach(cls => {
                const div = document.createElement('div');
                div.className = 'class-item';
                div.textContent = cls;
                div.onclick = () => selectClass(cls, div);
                container.appendChild(div);
            });
        }

        function selectClass(className, element) {
            // Highlight
            document.querySelectorAll('.class-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            const container = document.getElementById('moves-area');
            container.innerHTML = '';

            // Filter moves
            const moves = allMoves.filter(m => {
                if (className === "Special / Basic") return !m.class;
                return m.class === className;
            });

            // Group by Type
            const starting = moves.filter(m => m.type === 'starting').sort((a, b) => a.name.localeCompare(b.name));
            const advanced = moves.filter(m => m.type === 'advanced').sort((a, b) => a.name.localeCompare(b.name));
            const special = moves.filter(m => m.type !== 'starting' && m.type !== 'advanced').sort((a, b) => a.name.localeCompare(b.name));

            if (starting.length > 0) {
                renderMoveGroup('Starting Moves', starting, container);
            }
            if (advanced.length > 0) {
                renderMoveGroup('Advanced Moves', advanced, container);
            }
            if (special.length > 0) {
                renderMoveGroup('Special Moves', special, container);
            }

            if (moves.length === 0) {
                container.innerHTML = '<div style="padding:20px;">No moves found for this category.</div>';
            }
        }

        function renderMoveGroup(title, moves, container) {
            const h3 = document.createElement('div');
            h3.className = 'move-category';
            h3.textContent = title;
            container.appendChild(h3);

            moves.forEach(m => {
                const div = document.createElement('div');
                div.className = 'move-card';
                // Strip markdown for preview? Or just show raw? 
                // Let's strip simple markdown for the preview part
                const cleanDesc = m.description.replace(/(\*|_|#|\[|\])/g, '');

                div.innerHTML = `
                    <h4>${m.name}</h4>
                    <div class="desc">${cleanDesc}</div>
                `;
                div.onclick = () => addMoveToChar(m.id, m.name);
                container.appendChild(div);
            });
        }

        async function addMoveToChar(moveId, moveName) {
            if (!activeCharId) return;

            if (!confirm(`Add "${moveName}" to selected character?`)) return;

            try {
                const res = await fetch(`/dw/characters/${activeCharId}/moves?ignore_requirements=true`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ move_id: moveId })
                });

                if (res.ok) {
                    alert(`"${moveName}" added successfully!`);
                    // We don't necessarily close the modal, maybe they want to add more?
                    // But usually one at a time. Let's close it for cleanliness.
                    closeMoveModal();
                } else {
                    const err = await res.json();
                    alert('Error adding move: ' + err.detail);
                }
            } catch (e) {
                console.error(e);
                alert('Network error');
            }
        }

        init();
    </script>
</body>

</html>
