<!DOCTYPE html>
<html>

<head>
    <title>DW - GM Character Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Merriweather&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/dw_sheet.css">
    <style>
        body {
            text-align: center;
            background-image: url('/static/dw_bg.jpg');
            background-size: cover;
            background-attachment: fixed;
            background-color: #2b2b2b;
            margin: 0;
            padding: 10px;
        }

        /* Top Header Bar */
        .controls-area {
            background: rgba(255, 255, 255, 0.95);
            max-width: 1200px;
            margin: 0 auto 20px auto;
            padding: 10px 20px;
            border: 2px solid #855;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
            display: flex;
            gap: 15px;
            align-items: center;
            justify-content: flex-start;
            border-radius: 4px;
        }

        h1 {
            color: #855;
            font-family: 'Cinzel', serif;
            font-size: 1.5em;
            margin: 0;
            padding-right: 20px;
            border-right: 1px solid #aaa;
            text-transform: uppercase;
        }

        /* Custom Dropdown Styling */
        .custom-select-container {
            position: relative;
            display: inline-block;
        }

        .dropdown-btn {
            background: #fff;
            border: 1px solid #888;
            padding: 8px 12px;
            cursor: pointer;
            min-width: 200px;
            text-align: left;
            font-family: inherit;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dropdown-btn:after {
            content: '▼';
            font-size: 0.8em;
            color: #666;
            margin-left: 10px;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #fff;
            min-width: 250px;
            max-height: 400px;
            overflow-y: auto;
            box-shadow: 0 8px 16px 0 rgba(0, 0, 0, 0.2);
            z-index: 100;
            border: 1px solid #888;
            text-align: left;
            top: 100%;
            left: 0;
        }

        .dropdown-content.show {
            display: block;
        }

        .dropdown-item {
            padding: 8px 12px;
            cursor: pointer;
            border-bottom: 1px solid #eee;
            color: #000;
            display: block;
        }

        .dropdown-item:hover {
            background-color: #f1f1f1;
        }

        .dropdown-item label {
            cursor: pointer;
            display: flex;
            align-items: center;
            width: 100%;
            margin: 0;
            /* Override global */
            font-weight: normal;
        }

        .dropdown-item input {
            margin-right: 10px;
            width: auto;
            /* Override global */
        }

        .btn {
            background: #855;
            color: #fff;
            border: none;
            padding: 8px 16px;
            font-size: 0.9em;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Cinzel', serif;
            text-transform: uppercase;
            transition: all 0.2s;
            height: fit-content;
        }

        .btn:hover {
            box-shadow: 0 0 5px #f4e4bc;
            background: #a66;
        }

        .btn-secondary {
            background: #555;
            font-size: 0.8em;
        }

        /* Grid Layout */
        .cards-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        @media (max-width: 1200px) {
            .cards-container {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 800px) {
            .cards-container {
                grid-template-columns: 1fr;
            }
        }

        /* Card Styling */
        .char-card {
            background: rgba(245, 245, 245, 0.95);
            border: 1px solid #444;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.7);
            padding: 15px;
            text-align: left;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .char-header {
            border-bottom: 2px solid #855;
            padding-bottom: 10px;
            margin-bottom: 15px;
            text-align: center;
        }

        .char-name {
            font-family: 'Cinzel', serif;
            font-size: 1.4em;
            color: #855;
            margin: 0;
        }

        .char-class {
            font-style: italic;
            color: #555;
            font-size: 0.9em;
        }

        .form-section {
            background: rgba(230, 230, 230, 0.5);
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
        }

        .section-title {
            margin: 0 0 10px 0;
            color: #333;
            font-weight: bold;
            font-size: 0.9em;
            text-transform: uppercase;
            border-bottom: 1px solid #aaa;
            padding-bottom: 2px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 5px;
        }

        label {
            display: block;
            color: #444;
            margin-bottom: 2px;
            font-size: 0.8em;
            font-weight: bold;
        }

        input[type="number"] {
            background: #fff;
            border: 1px solid #999;
            color: #000;
            padding: 5px;
            width: 100%;
            font-family: inherit;
            font-size: 1em;
            box-sizing: border-box;
        }

        .status-msg {
            text-align: center;
            font-weight: bold;
            height: 20px;
            margin-top: 10px;
            font-size: 0.9em;
        }

        .back-link {
            display: inline-block;
            margin-top: 40px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 20px;
            color: #eee;
            text-decoration: none;
            font-weight: bold;
            border: 1px solid #555;
        }
    </style>
</head>

<body>

    <div class="controls-area">
        <h1>DW Manager</h1>

        <div class="custom-select-container">
            <div class="dropdown-btn" onclick="toggleDropdown()">Select Characters</div>
            <div id="dropdown-list" class="dropdown-content">
                <!-- Checkboxes populated here -->
            </div>
        </div>

        <button class="btn" onclick="loadSelected()">Load Selected</button>

        <div style="margin-left:auto; display:flex; gap:10px;">
            <button class="btn btn-secondary" onclick="gridTemplate3()">3 Col</button>
            <button class="btn btn-secondary" onclick="gridTemplate4()">4 Col</button>
        </div>
    </div>

    <div id="cards-container" class="cards-container">
        <!-- Cards injected here -->
    </div>

    <a href="/static/dw/gm_panel.html" class="back-link">&lt; Back to GM Panel</a>

    <script>
        let loadedCharacters = [];

        async function init() {
            try {
                const res = await fetch('/dw/characters');
                const chars = await res.json();
                loadedCharacters = chars; // Cache list

                const list = document.getElementById('dropdown-list');
                list.innerHTML = '';

                // Add "Select All" option? Maybe later.

                chars.forEach(c => {
                    const div = document.createElement('div');
                    div.className = 'dropdown-item';
                    div.innerHTML = `
                        <label>
                            <input type="checkbox" value="${c.id}" class="char-checkbox">
                            ${c.name} <span style="font-size:0.8em; color:#666; margin-left:5px;">(${c.hero_class})</span>
                        </label>
                    `;
                    list.appendChild(div);
                });
            } catch (e) {
                console.error("Failed to load characters list", e);
            }
        }

        function toggleDropdown() {
            document.getElementById("dropdown-list").classList.toggle("show");
        }

        // Close dropdown if clicked outside
        window.onclick = function (event) {
            if (!event.target.matches('.dropdown-btn') && !event.target.closest('.dropdown-content')) {
                var dropdowns = document.getElementsByClassName("dropdown-content");
                for (var i = 0; i < dropdowns.length; i++) {
                    var openDropdown = dropdowns[i];
                    if (openDropdown.classList.contains('show')) {
                        openDropdown.classList.remove('show');
                    }
                }
            }
        }

        async function loadSelected() {
            const checkboxes = document.querySelectorAll('.char-checkbox:checked');
            const selectedIds = Array.from(checkboxes).map(cb => cb.value);
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            if (selectedIds.length === 0) {
                container.innerHTML = '<div style="grid-column:1/-1; color:#fff; font-size:1.2em;">No characters selected.</div>';
                return;
            }

            // Reuse cached list if we have full data, but simple list might lack details?
            // The /dw/characters endpoint returns full objects according to schema (response_model=List[DWCharacter]).
            // So we can just use loadedCharacters.

            const selectedChars = loadedCharacters.filter(c => selectedIds.includes(String(c.id)));

            // Re-fetch to be safe about latest state? User might have edited elsewhere.
            // Let's re-fetch all for simplicity since N is small.
            try {
                const res = await fetch('/dw/characters');
                const allChars = await res.json();
                loadedCharacters = allChars; // Update cache

                const FRESHselectedChars = allChars.filter(c => selectedIds.includes(String(c.id)));

                FRESHselectedChars.forEach(char => {
                    renderCard(char, container);
                });
            } catch (e) {
                console.error(e);
            }

            // Hide dropdown
            document.getElementById("dropdown-list").classList.remove("show");
        }

        function renderCard(char, container) {
            // Handle STR/INT aliases from API vs JSON
            const strVal = char.str !== undefined ? char.str : char.strength;
            const intVal = char.int !== undefined ? char.int : char.int_stat;

            const card = document.createElement('div');
            card.className = 'char-card';
            card.id = `card-${char.id}`;

            card.innerHTML = `
                <div class="char-header">
                    <h2 class="char-name">${char.name}</h2>
                    <span class="char-class">${char.hero_class} | Lvl ${char.level}</span>
                </div>

                <div class="form-section">
                    <div class="section-title">Vitals</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>HP Current</label>
                            <input type="number" class="inp-hp" value="${char.current_hp}">
                        </div>
                        <div class="form-group">
                            <label>HP Max</label>
                            <input type="number" class="inp-max-hp" value="${char.max_hp}">
                        </div>
                        <div class="form-group">
                            <label>XP</label>
                            <input type="number" class="inp-xp" value="${char.xp}">
                        </div>
                        <div class="form-group">
                            <label>Level</label>
                            <input type="number" class="inp-level" value="${char.level}">
                        </div>
                        <div class="form-group">
                            <label>Coin</label>
                            <input type="number" class="inp-coin" value="${char.coin || 0}">
                        </div>
                    </div>
                </div>

                <div class="form-section">
                    <div class="section-title">Stats</div>
                    <div class="form-grid">
                        <div class="form-group">
                            <label>STR</label>
                            <input type="number" class="inp-str" value="${strVal}" min="3" max="18">
                        </div>
                        <div class="form-group">
                            <label>DEX</label>
                            <input type="number" class="inp-dex" value="${char.dex}" min="3" max="18">
                        </div>
                        <div class="form-group">
                            <label>CON</label>
                            <input type="number" class="inp-con" value="${char.con}" min="3" max="18">
                        </div>
                        <div class="form-group">
                            <label>INT</label>
                            <input type="number" class="inp-int" value="${intVal}" min="3" max="18">
                        </div>
                        <div class="form-group">
                            <label>WIS</label>
                            <input type="number" class="inp-wis" value="${char.wis}" min="3" max="18">
                        </div>
                        <div class="form-group">
                            <label>CHA</label>
                            <input type="number" class="inp-cha" value="${char.cha}" min="3" max="18">
                        </div>
                    </div>
                </div>

                <button class="btn" style="width:100%; margin-top:auto;" onclick="saveCard(${char.id})">Save Changes</button>
                <div class="status-msg" id="status-${char.id}"></div>
            `;
            container.appendChild(card);
        }

        async function saveCard(id) {
            const card = document.getElementById(`card-${id}`);
            const status = document.getElementById(`status-${id}`);

            // Gather data
            const updates = {
                current_hp: parseInt(card.querySelector('.inp-hp').value),
                max_hp: parseInt(card.querySelector('.inp-max-hp').value),
                xp: parseInt(card.querySelector('.inp-xp').value),
                level: parseInt(card.querySelector('.inp-level').value),
                coin: parseInt(card.querySelector('.inp-coin').value),
                str: parseInt(card.querySelector('.inp-str').value),
                dex: parseInt(card.querySelector('.inp-dex').value),
                con: parseInt(card.querySelector('.inp-con').value),
                int: parseInt(card.querySelector('.inp-int').value),
                wis: parseInt(card.querySelector('.inp-wis').value),
                cha: parseInt(card.querySelector('.inp-cha').value),
            };

            status.textContent = "Saving...";
            status.style.color = "#555";

            try {
                const res = await fetch(`/dw/characters/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updates)
                });

                if (res.ok) {
                    status.textContent = "Saved!";
                    status.style.color = "green";
                    setTimeout(() => status.textContent = "", 2000);
                } else {
                    status.textContent = "Error saving";
                    status.style.color = "red";
                }
            } catch (e) {
                console.error(e);
                status.textContent = "Network Error";
                status.style.color = "red";
            }
        }

        function gridTemplate3() {
            document.getElementById('cards-container').style.gridTemplateColumns = 'repeat(3, 1fr)';
        }
        function gridTemplate4() {
            document.getElementById('cards-container').style.gridTemplateColumns = 'repeat(4, 1fr)';
        }

        init();
    </script>
</body>

</html>
